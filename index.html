<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IAWise</title>
<meta name="description" content="Jogo instrutivo de redes neurais e aprendizagem por reforço com simuladores interativos, histórias e knowledge tracing. Derivado do DevWise.">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --sunken:#DCE3EA; --ink:#15233A; --muted:#56677F; --line:#C5D0DB;
  --nn:#0F7C7C; --nn-soft:#D5ECEA; --rl:#5546B0; --rl-soft:#E2DEF6;
  --gold:#B97F08; --gold-soft:#FBEBC4; --ok:#1B7F53; --ok-soft:#D8F0E3; --bad:#BC3550; --bad-soft:#F8DDE2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1828; --surface:#18243A; --sunken:#121D30; --ink:#E6ECF5; --muted:#9BABC2; --line:#2D3D58;
  --nn:#45BDB6; --nn-soft:#143A40; --rl:#A296F5; --rl-soft:#2A2757;
  --gold:#F0B73F; --gold-soft:#3D3116; --ok:#4CC98F; --ok-soft:#143B2C; --bad:#F2758E; --bad-soft:#44202B;}}
:root[data-theme="dark"]{
  --bg:#0F1828; --surface:#18243A; --sunken:#121D30; --ink:#E6ECF5; --muted:#9BABC2; --line:#2D3D58;
  --nn:#45BDB6; --nn-soft:#143A40; --rl:#A296F5; --rl-soft:#2A2757;
  --gold:#F0B73F; --gold-soft:#3D3116; --ok:#4CC98F; --ok-soft:#143B2C; --bad:#F2758E; --bad-soft:#44202B;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0}
p{margin:0 0 .8em;text-align:justify}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:18px 0;border-bottom:2px solid var(--ink);margin-bottom:26px}
.brand{font-family:var(--display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;background:none;border:0;padding:0}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.95rem;color:var(--muted)}
.stats b{color:var(--ink)}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:none;border:2px solid transparent;border-radius:999px;padding:5px 15px;font-weight:700}
.nav button[aria-current="page"]{border-color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:11px 22px;font-weight:700}
.btn.ghost{background:none;color:var(--ink)}
.btn.small{padding:6px 14px;font-size:.92rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.empty{color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.tag{padding:2px 9px;border-radius:999px;background:var(--sunken);font-size:.85rem}
.tag.nn{background:var(--nn-soft)} .tag.rl{background:var(--rl-soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:.85rem;margin:8px 0}
.chip{font-size:.85rem;padding:3px 10px;border-radius:6px;background:var(--ok-soft);border:1px solid var(--ok)}
/* início */
.home{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start;padding-top:10px}
.home h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;letter-spacing:-.04em}
.home .lead{font-size:1.12rem;max-width:36em;margin:18px 0 22px}
.qs{display:grid;gap:10px;margin-bottom:22px}
.q{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.95rem}
.q span{font-size:1.8rem;text-align:center}
.q.nn{border-left:8px solid var(--nn)} .q.rl{border-left:8px solid var(--rl)}
.kpis{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:120px}
.kpi b{display:block;font-family:var(--display);font-size:1.8rem;font-weight:800;color:var(--gold)}
.kpi span{font-size:.85rem;color:var(--muted)}
.loop{list-style:none;margin:0;padding:0;counter-reset:s}
.loop li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.loop li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:1.9rem;color:var(--gold);line-height:1}
.loop strong{display:block}
/* mapa */
.world.nn{border-left:10px solid var(--nn)} .world.rl{border-left:10px solid var(--rl)}
.whead{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.wicon{font-size:2.2rem}
.whead h2{font-size:1.6rem;font-weight:800}
.mapwrap{overflow-x:auto}
.mapsvg{display:block;min-width:560px;width:100%;height:auto}
.edge{stroke:var(--line);stroke-width:3} .edge.on{stroke:var(--gold)}
.node{cursor:pointer}
.node circle{fill:var(--surface);stroke:var(--line);stroke-width:3}
.node.ok circle{fill:var(--ok-soft);stroke:var(--ok)} .node.prog circle{stroke:var(--gold)} .node.warn circle{fill:var(--gold-soft);stroke:var(--gold)}
.node.locked circle{fill:var(--sunken)} .node.soon circle{stroke-dasharray:6 4}
.node.sel circle{stroke:var(--ink);stroke-width:4}
.node text{font-family:var(--body);fill:var(--ink)}
.node .pct{font-family:var(--display);font-weight:800;font-size:14px}
.node .lbl{font-size:11.5px}
.node.locked .lbl,.node.soon .lbl{fill:var(--muted)}
.skillinfo{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.95rem}
.skillinfo h4{font-size:1.15rem;margin:0 0 4px}
/* fase */
.lhead{padding:0 0 12px 16px;border-left:10px solid var(--nn);margin-bottom:14px}
.lhead.rl{border-left-color:var(--rl)}
.lhead h2{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;margin:8px 0 4px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:700}
.tabs button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.work{max-width:960px}
.client{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.story{font-size:1.08rem}
.panel h3{font-size:1.25rem;margin:0 0 8px}
.concept{padding:12px 0;border-top:1px solid var(--line)}
.concept:first-child{border-top:0;padding-top:0}
.concept h3{font-size:1.1rem}
/* simulador */
.simbox{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:18px;align-items:start}
.simarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.simcv{display:block;border-radius:8px;background:var(--sunken)}
.ctls{display:grid;gap:8px;margin-top:12px}
.ctl{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;font-size:.92rem}
.ctl span{color:var(--muted)} .ctl .mono{font-family:var(--mono);color:var(--ink)}
.ctl output{font-family:var(--mono);font-size:.85rem;text-align:right}
.ctl select,.ctl input[type=number],.ctl input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.ctl input[type=range]{width:100%;accent-color:var(--gold)}
.ctl.chk{grid-template-columns:auto 1fr}
.siminfo{font-family:var(--mono);font-size:.88rem;padding:8px 10px;background:var(--sunken);border-radius:8px}
.tasks h3{font-size:1.1rem;margin-bottom:10px}
.task{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--gold);border-radius:4px 12px 12px 4px;padding:12px 14px;margin-bottom:10px}
.task.done{border-left-color:var(--ok);opacity:.75}
.task p{margin:6px 0 10px;font-size:.98rem}
.tmeta{display:flex;justify-content:space-between;align-items:center}
.pts{letter-spacing:2px;color:var(--gold)}
.hint{background:var(--gold-soft);border-radius:8px;padding:8px 10px;font-size:.92rem}
.feedback{padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:.95rem}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)} .feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
/* loja */
.modes{display:grid;gap:10px}
.mode{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:4px}
.mode.on{border-color:var(--ink)} .mode span{font-size:.88rem;color:var(--muted)}
.shopitem{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sicon{font-size:1.8rem;text-align:center} .shopitem p{margin:2px 0;font-size:.92rem;text-align:left}
/* relatório */
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.bar{display:inline-block;width:80px;height:9px;background:var(--sunken);border-radius:4px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.json{font:12px var(--mono);white-space:pre-wrap;max-height:300px;overflow:auto;background:var(--sunken);padding:10px;border-radius:8px}
.printonly{display:none}
@media print{.top,.noprint,.tabs{display:none!important}.printonly{display:block}.wrap{padding:0}body{background:#fff;color:#000}}
@media (max-width:820px){.home{grid-template-columns:1fr}.simbox{grid-template-columns:1fr}.ctl{grid-template-columns:110px 1fr 50px}.nav{margin-left:0}}
.mgroup{padding:10px 0;border-top:1px solid var(--line)} .mgroup:first-of-type{border-top:0}
.mgroup h3{font-size:1.02rem;color:var(--muted);margin-bottom:6px}
.mlink{display:block;padding:6px 0;color:var(--ink);text-decoration:none;font-size:.97rem} .mlink:hover{text-decoration:underline}
.mlink .tag{font-size:.75rem;margin-right:4px}
.whead.small{margin:14px 0 6px;padding-left:10px;border-left:6px solid var(--nn)} .whead.small.rl{border-left-color:var(--rl)} .whead.small .wicon{font-size:1.5rem} .whead.small h4{font-size:1.1rem}
.tblwrap{overflow-x:auto}
.maplist{display:grid;gap:8px}
.mapitem{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
.mapitem b{font-family:var(--display);font-size:.95rem} .mapitem i{font-style:normal;font-size:.8rem;color:var(--muted)}
.mapitem.ok{border-color:var(--ok)} .mapitem.prog,.mapitem.warn{border-color:var(--gold)} .mapitem.locked{opacity:.7} .mapitem.soon{border-style:dashed} .mapitem.sel{border-color:var(--ink)}
.tutor{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tutor h3{font-size:1.1rem;margin-bottom:8px}
.chatlog{display:grid;gap:8px;max-height:320px;overflow:auto;margin:10px 0;padding:6px 0}
.msg{padding:9px 12px;border-radius:10px;font-size:.95rem;white-space:pre-wrap;max-width:92%;text-align:left}
.msg.user{background:var(--sunken);justify-self:end} .msg.assistant{background:var(--gold-soft);justify-self:start}
.tutor textarea{flex:1;min-width:200px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.msg.error{background:var(--bad-soft);border:1px solid var(--bad);justify-self:start}
.soonrow td{color:var(--muted)} .errc{color:var(--bad);font-weight:700}
.pendw{margin:12px 0 4px;font-size:1.02rem} .pendl{margin:6px 0 2px} .pend{margin:0 0 6px;padding-left:20px;font-size:.93rem} .pend li{margin:3px 0}
@media print{.tblwrap{overflow:visible}.panel{break-inside:avoid-page}}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* IAWise - dados independentes de idioma natural.
   Textos ficam em src/lang-pt.js e src/lang-en.js. Estrutura derivada do DevWise (pedromilken/DevWise),
   com o conteúdo das disciplinas GBC073 (Inteligência Computacional) e GBC063 (Inteligência Artificial), UFU/FACOM. */
const LANG = {};

/* Dois mundos = as duas disciplinas. Cada um responde a uma pergunta-guia. */
const WORLDS = [
  {id:"nn", icon:"🧠", color:"nn"},   // GBC073: "Como construir máquinas que aprendem a partir de dados?"
  {id:"rl", icon:"🤖", color:"rl"}    // GBC063: "Como construir agentes que tomam boas decisões?"
];

/* Uma fase por aula. pre: fases que precisam de 60% de domínio; gate: XP acumulado exigido; sim: simulador (null = em construção).
   x,y: posição no mapa (SVG 640 x 420 por mundo). */
const LESSONS = [
  /* ---- Mundo 1: redes neurais e deep learning (GBC073) ---- */
  {id:"nn01", world:"nn", n:1, pre:[], gate:0, sim:"perceptron", x:60, y:70},
  {id:"nn02", world:"nn", n:2, pre:["nn01"], gate:60, sim:"represent", x:180, y:70},
  {id:"nn03", world:"nn", n:3, pre:["nn02"], gate:120, sim:"gradient", x:300, y:70},
  {id:"nn04", world:"nn", n:4, pre:["nn03"], gate:180, sim:"backprop", x:420, y:70},
  {id:"nn05", world:"nn", n:5, pre:["nn04"], gate:240, sim:"optimizers", x:540, y:70},
  {id:"nn06", world:"nn", n:6, pre:["nn05"], gate:300, sim:"overfit", x:540, y:180},
  {id:"nn07", world:"nn", n:7, pre:["nn06"], gate:360, sim:"conv", x:420, y:180},
  {id:"nn08", world:"nn", n:8, pre:["nn07"], gate:420, sim:"rnn", x:300, y:180},
  {id:"nn09", world:"nn", n:9, pre:["nn08"], gate:480, sim:"attention", x:180, y:180},
  {id:"nn10", world:"nn", n:10, pre:["nn09"], gate:540, sim:"autoenc", x:60, y:180},
  {id:"nn11", world:"nn", n:11, pre:["nn10"], gate:600, sim:"hopfield", x:60, y:290},
  {id:"nn12", world:"nn", n:12, pre:["nn11"], gate:660, sim:"field", x:180, y:290},
  {id:"nn13", world:"nn", n:13, pre:["nn12"], gate:720, sim:"spiral", x:300, y:290},
  {id:"nn14", world:"nn", n:14, pre:["nn13"], gate:780, sim:"evo", x:420, y:290},
  /* ---- Mundo 2: aprendizagem por reforço (GBC063) ---- */
  {id:"rl01", world:"rl", n:1, pre:[], gate:0, sim:"rover", x:60, y:70},
  {id:"rl02", world:"rl", n:2, pre:["rl01"], gate:60, sim:"gridworld", x:180, y:70},
  {id:"rl03", world:"rl", n:3, pre:["rl02"], gate:120, sim:"mctd", x:300, y:70},
  {id:"rl04", world:"rl", n:4, pre:["rl03"], gate:180, sim:"cliff", x:420, y:70},
  {id:"rl05", world:"rl", n:5, pre:["rl04"], gate:240, sim:"reinforce", x:540, y:70},
  {id:"rl06", world:"rl", n:6, pre:["rl05"], gate:300, sim:"ppo", x:540, y:180},
  {id:"rl07", world:"rl", n:7, pre:["rl06"], gate:360, sim:"gae", x:420, y:180},
  {id:"rl08", world:"rl", n:8, pre:["rl07"], gate:420, sim:"rlhf", x:300, y:180},
  {id:"rl09", world:"rl", n:9, pre:["rl08"], gate:480, sim:"bandit", x:180, y:180},
  {id:"rl10", world:"rl", n:10, pre:["rl09"], gate:540, sim:"hoeffding", x:60, y:180},
  {id:"rl11", world:"rl", n:11, pre:["rl10"], gate:600, sim:"thompson", x:60, y:290},
  {id:"rl12", world:"rl", n:12, pre:["rl11"], gate:660, sim:"riverswim", x:180, y:290},
  {id:"rl13", world:"rl", n:13, pre:["rl12"], gate:720, sim:"mcts", x:300, y:290},
  {id:"rl14", world:"rl", n:14, pre:["rl13"], gate:780, sim:"alphazero", x:420, y:290}
];

/* Tarefas de cada simulador: são os "itens" do rastreamento do conhecimento.
   d: dificuldade autoral (1 a 3), c: probabilidade de acerto ao acaso (verificação de estado tem chute baixo).
   O texto de cada tarefa fica em lang-*.js em lessons[id].tasks[i]. A verificação vive em sims.js. */
const TASKS = {
  perceptron: [{id:"p1",d:1},{id:"p2",d:2},{id:"p3",d:2},{id:"p4",d:3}],
  represent:  [{id:"r1",d:1},{id:"r2",d:2},{id:"r3",d:2},{id:"r4",d:3}],
  gradient:   [{id:"g1",d:1},{id:"g2",d:2},{id:"g3",d:2},{id:"g4",d:3}],
  backprop:   [{id:"b1",d:1},{id:"b2",d:2},{id:"b3",d:3},{id:"b4",d:3}],
  optimizers: [{id:"o1",d:1},{id:"o2",d:2},{id:"o3",d:2},{id:"o4",d:3}],
  rover:      [{id:"m1",d:1},{id:"m2",d:2},{id:"m3",d:2},{id:"m4",d:3}],
  gridworld:  [{id:"w1",d:1},{id:"w2",d:2},{id:"w3",d:2},{id:"w4",d:3}],
  overfit: [{id:"overfit1",k:"o1",d:1},{id:"overfit2",k:"o2",d:2},{id:"overfit3",k:"o3",d:2},{id:"overfit4",k:"o4",d:3}],
  conv: [{id:"conv1",k:"c1",d:1},{id:"conv2",k:"c2",d:2},{id:"conv3",k:"c3",d:2},{id:"conv4",k:"c4",d:3}],
  rnn: [{id:"rnn1",k:"r1",d:1},{id:"rnn2",k:"r2",d:2},{id:"rnn3",k:"r3",d:2},{id:"rnn4",k:"r4",d:3}],
  attention: [{id:"attention1",k:"a1",d:1},{id:"attention2",k:"a2",d:1},{id:"attention3",k:"a3",d:2},{id:"attention4",k:"a4",d:3}],
  autoenc: [{id:"autoenc1",k:"e1",d:1},{id:"autoenc2",k:"e2",d:1},{id:"autoenc3",k:"e3",d:2},{id:"autoenc4",k:"e4",d:3}],
  hopfield: [{id:"hopfield1",k:"h1",d:1},{id:"hopfield2",k:"h2",d:2},{id:"hopfield3",k:"h3",d:2},{id:"hopfield4",k:"h4",d:3}],
  field: [{id:"field1",k:"f1",d:1},{id:"field2",k:"f2",d:2},{id:"field3",k:"f3",d:2},{id:"field4",k:"f4",d:3}],
  spiral: [{id:"spiral1",k:"s1",d:1},{id:"spiral2",k:"s2",d:2},{id:"spiral3",k:"s3",d:3},{id:"spiral4",k:"s4",d:2}],
  evo: [{id:"evo1",k:"e1",d:1},{id:"evo2",k:"e2",d:1},{id:"evo3",k:"e3",d:2},{id:"evo4",k:"e4",d:3}],
  mctd: [{id:"mctd1",k:"t1",d:1},{id:"mctd2",k:"t2",d:1},{id:"mctd3",k:"t3",d:2},{id:"mctd4",k:"t4",d:3}],
  cliff: [{id:"cliff1",k:"q1",d:1},{id:"cliff2",k:"q2",d:2},{id:"cliff3",k:"q3",d:2},{id:"cliff4",k:"q4",d:3}],
  reinforce: [{id:"reinforce1",k:"g1",d:1},{id:"reinforce2",k:"g2",d:2},{id:"reinforce3",k:"g3",d:2},{id:"reinforce4",k:"g4",d:3}],
  ppo: [{id:"ppo1",k:"c1",d:1},{id:"ppo2",k:"c2",d:1},{id:"ppo3",k:"c3",d:2},{id:"ppo4",k:"c4",d:3}],
  gae: [{id:"gae1",k:"l1",d:1},{id:"gae2",k:"l2",d:1},{id:"gae3",k:"l3",d:3},{id:"gae4",k:"l4",d:2}],

/* DevWise - modelos de rastreamento do conhecimento.

   Um modelo PILOTA o jogo (calcula o domínio exibido, libera fases, escolhe a dificuldade do próximo ticket). Os demais rodam como
   SOMBRAS: antes de cada resposta registram no log a probabilidade de acerto que previam, e atualizam o próprio estado, sem interferir.
   A seleção segue as ferramentas do estudo de confundidores com o ENEM que podem rodar no navegador sem treino prévio:
     elo  Elo/Rasch online com dificuldade de item e chute (estrutura do lado do item; piloto padrão)
     irt  TRI de 3 parâmetros com habilidade por EAP numa grade de 81 pontos, só com as respostas anteriores (o "teto" psicométrico)
     bkt  Bayesian Knowledge Tracing (Corbett e Anderson)
     pfa  Performance Factors Analysis (sucessos e falhas anteriores)
     afm  Additive Factor Model (contagem de oportunidades)
   As arquiteturas profundas do estudo (DKT, DKVMN, SAKT, AKT, SAINT, SimpleKT) exigem treino em muitos alunos: o log exportado tem o
   formato necessário para treiná-las fora do jogo.

   TODOS os parâmetros abaixo são a priori de projeto, não estimativas. A recomendação do próprio estudo vale aqui: recalibrar os itens
   na população real, a partir dos logs exportados, e republicar as dificuldades em ITEM_B. */
const KT = (() => {
  const sig = x => 1 / (1 + Math.exp(-x)), logit = p => Math.log(p / (1 - p)), clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const B_SCALE = 1.2;                                   // dificuldade autoral 1, 2, 3 vira b = -1,2, 0, +1,2 logits
  const ITEM_B = {};                                     // recalibração empírica por item (id -> b), quando houver dados
  const itemB = it => ITEM_B[it.id] != null ? ITEM_B[it.id] : (it.d - 2) * B_SCALE;
  const GRID = Array.from({ length: 81 }, (_, i) => -4 + i * 0.1);

  const MODELS = {
    /* K0 e DEC calibrados por simulação (iniciante domina uma habilidade em ~10 tickets). WRONG < 1 amortece a queda após um erro isolado
       (tolerância a deslize, como o 'slip' do BKT): sem isso um único erro num item fácil apagava dois acertos. Custo assumido: leve viés para cima. */
    elo: { master: 0.85, K0: 1.8, DEC: 0.06, WRONG: 0.7,
      init: L => ({ th: logit(clamp(L, .02, .98)), n: 0 }),
      predict: (m, it, c) => c + (1 - c) * sig(m.th - itemB(it)),
      update(m, it, c, y) { const p = this.predict(m, it, c); m.th = clamp(m.th + this.K0 / (1 + this.DEC * m.n) * (y - p) * (y ? 1 : this.WRONG), -4, 5); m.n++; },
      mastery: m => sig(m.th) },
    irt: { master: 0.85, shadowOnly: true,   // referência psicométrica ESTÁTICA (o "teto" do estudo): não acompanha quem está aprendendo, então nunca pilota
      init: L => ({ mu: logit(clamp(L, .02, .98)), r: [] }),
      post(m) { let w = GRID.map(t => Math.exp(-0.5 * Math.pow((t - m.mu) / 1.2, 2))); for (const [b, c, y] of m.r) w = w.map((x, i) => { const p = c + (1 - c) * sig(GRID[i] - b); return x * (y ? p : 1 - p); }); const s = w.reduce((a, b) => a + b, 0) || 1; return w.map(x => x / s); },
      predict(m, it, c) { const w = this.post(m), b = itemB(it); return w.reduce((a, x, i) => a + x * (c + (1 - c) * sig(GRID[i] - b)), 0); },
      update(m, it, c, y) { m.r.push([+itemB(it).toFixed(2), +c.toFixed(3), y ? 1 : 0]); if (m.r.length > 60) m.r.shift(); },
      mastery(m) { const w = this.post(m); return sig(w.reduce((a, x, i) => a + x * GRID[i], 0)); } },
    bkt: { master: 0.95, T: 0.2, SLIP: 0.1,
      init: L => ({ L }),
      predict(m, it, c) { return m.L * (1 - this.SLIP) + (1 - m.L) * c; },
      update(m, it, c, y) { const s = this.SLIP, L = m.L, post = y ? L * (1 - s) / (L * (1 - s) + (1 - L) * c) : L * s / (L * s + (1 - L) * (1 - c)); m.L = Math.min(.995, post + (1 - post) * this.T); },
      mastery: m => m.L },
    pfa: { master: 0.85, BETA: -1.4, GAMMA: 0.75, RHO: -0.15,
      init: L => ({ s: 0, f: 0, b0: logit(clamp(L, .02, .98)) - (-1.4) - 0.34 }),
      lin(m) { return this.BETA + m.b0 + 0.34 + this.GAMMA * m.s + this.RHO * m.f; },
      predict(m) { return sig(this.lin(m)); },
      update(m, it, c, y) { if (y) m.s++; else m.f++; },
      mastery(m) { return sig(this.lin(m)); } },
    afm: { master: 0.85, BETA: -1.4, GAMMA: 0.45,
      init: L => ({ n: 0, b0: logit(clamp(L, .02, .98)) - (-1.4) - 0.34 }),
      lin(m) { return this.BETA + m.b0 + 0.34 + this.GAMMA * m.n; },
      predict(m) { return sig(this.lin(m)); },
      update(m) { m.n++; },
      mastery(m) { return sig(this.lin(m)); } }
  };
  const IDS = Object.keys(MODELS);
  return {
    IDS, MODELS, itemB, PILOTS: IDS.filter(k => !MODELS[k].shadowOnly),
    ensure(tr) { if (!tr.m) tr.m = {}; for (const k of IDS) if (!tr.m[k]) tr.m[k] = MODELS[k].init(tr.L); return tr; },
    predictAll(tr, it, c) { this.ensure(tr); const o = {}; for (const k of IDS) o[k] = +clamp(MODELS[k].predict(tr.m[k], it, c), .001, .999).toFixed(4); return o; },
    updateAll(tr, it, c, y) { this.ensure(tr); for (const k of IDS) MODELS[k].update(tr.m[k], it, c, y); },
    mastery(tr, pilot) { this.ensure(tr); return clamp(MODELS[pilot].mastery(tr.m[pilot]), .001, .999); },
    master: pilot => MODELS[pilot].master,
    /* métricas de previsão sobre um log: Brier, AUC (Mann-Whitney) e acurácia a 0,5 */
    score(log, k) { const rows = log.filter(l => l.preds && l.preds[k] != null); if (!rows.length) return null;
      const brier = rows.reduce((a, l) => a + Math.pow(l.preds[k] - (l.ok ? 1 : 0), 2), 0) / rows.length, acc = rows.filter(l => (l.preds[k] >= .5) === !!l.ok).length / rows.length;
      const pos = rows.filter(l => l.ok).map(l => l.preds[k]), neg = rows.filter(l => !l.ok).map(l => l.preds[k]); let auc = null;
      if (pos.length && neg.length) { let w = 0; for (const a of pos) for (const b of neg) w += a > b ? 1 : a === b ? .5 : 0; auc = w / (pos.length * neg.length); }
      return { n: rows.length, brier, auc, acc }; }
  };
})();

/* IAWise - simuladores interativos.
   Cada simulador exporta mount(el, api) e devolve {check(taskId) -> boolean, destroy()}.
   api.s(key) devolve o texto do simulador no idioma atual; api.refreshTasks() repinta a lista de tarefas. */
const SIMS = {};

/* ---------- utilidades de interface ---------- */
const H = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const k in attrs) { if (k === "class") e.className = attrs[k]; else if (k === "style") e.style.cssText = attrs[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c))); return e; };
function slider(label, min, max, step, val, on, fmt = v => v) {
  const out = H("output", {}, fmt(val));
  const inp = H("input", { type: "range", min, max, step, value: val, oninput: e => { const v = +e.target.value; out.textContent = fmt(v); on(v); } });
  const wrap = H("label", { class: "ctl" }, H("span", {}, label), inp, out);
  wrap.set = v => { inp.value = v; out.textContent = fmt(v); };
  return wrap;
}
function select(label, opts, val, on) {
  const sel = H("select", { onchange: e => on(e.target.value) }, ...opts.map(([v, l]) => H("option", { value: v, ...(v === val ? { selected: "" } : {}) }, l)));
  return H("label", { class: "ctl" }, H("span", {}, label), sel);
}
const btn = (label, on, cls = "btn small") => H("button", { class: cls, onclick: on }, label);
function canvas(el, w, h) {
  const c = H("canvas", { class: "simcv" }); el.append(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = w * dpr; c.height = h * dpr; c.style.width = "100%"; c.style.maxWidth = w + "px"; c.style.aspectRatio = w + "/" + h;
  const g = c.getContext("2d"); g.scale(dpr, dpr); c.g = g; c.w = w; c.h = h; return c;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = () => ({ ink: css("--ink"), muted: css("--muted"), line: css("--line"), a: css("--nn"), b: css("--rl"), ok: css("--ok"), bad: css("--bad"), gold: css("--gold"), surface: css("--surface"), sunken: css("--sunken") });
const fmt2 = v => (Math.round(v * 100) / 100).toFixed(2);

  nn10: { client: "Compressão de registros de sensores", title: "Guardar menos sem perder o essencial",

  nn11: { client: "Leitor de etiquetas desbotadas", title: "Uma memória que se completa sozinha",

  nn12: { client: "Digitalização do perfil de peças", title: "Uma rede que é o próprio sinal",

  nn14: { client: "Encerramento: o time de otimização", title: "Uma função, uma perda, um otimizador",

  rl03: { client: "Rover aprendendo sem mapa", title: "Esperar o fim ou aprender no caminho",

  rl04: { client: "Rover na beira do penhasco", title: "O caminho ótimo e o caminho seguro",

  rl05: { client: "Estratégia de coleta do rover", title: "Empurrar a política na direção do que deu certo",

  rl07: { client: "Crítico do controlador", title: "Um botão entre viés e variância",

lessons: {
  nn01: { name: "Perceptron", about: "Artificial neuron, linear boundary and the learning rule.", client: "Part sorting at São José Metalworks",
    title: "The machine that tells good parts from bad ones",
    story: "On the inspection line every part is measured on two things: weight and shine. Dona Célia, with thirty years of trained eyes, looks and decides: approved or scrap. She wants to retire and the factory needs a machine to learn the same decision. The first model the engineers try is the simplest possible: a straight line on the weight × shine plane. On one side, approve; on the other, scrap. The question is whether that line can be found on its own, from the examples Dona Célia already labelled, and whether every decision she makes fits on a line.",
    theory: [
      ["A neuron is a weighted sum with a threshold", "The perceptron computes w₁x₁ + w₂x₂ + b and fires (class 1) if the result is greater than or equal to zero. The weights w say how much each measurement matters; the bias b shifts the boundary. Geometrically, w·x + b = 0 is a line, and the vector w points to the side the network calls 1. Analogy: a two-pan scale with a fixed counterweight."],
      ["The learning rule only corrects on mistakes", "For each misclassified example, update w ← w + η(y − ŷ)x and b ← b + η(y − ŷ). If the network said 0 and it was 1, the weights are pulled towards the point; if it said 1 and it was 0, pushed away. Rosenblatt proved that if a separating line exists, this procedure finds one in a finite number of steps."],
      ["Limit: only what is linearly separable", "Minsky and Papert (1969) showed that XOR does not fit on a line: the points (0,1) and (1,0) of one class surround (0,0) and (1,1) of the other. No adjustment of w solves it. The way out, which took years to be accepted, is stacking neurons in layers, the topic of the next stage."]
    ],
    tasks: { p1: { t: "Make the network score 100% on the AND set (by hand or by training).", h: "AND is only 1 in the top-right corner. Push the line to cut that corner alone: positive weights and a clearly negative b." },
             p2: { t: "Choose the Random set, reset the weights and let the training rule reach 100% in at most 40 steps, without touching the sliders.", h: "Each step corrects one wrong point. A learning rate between 0.2 and 0.5 is usually enough." },
             p3: { t: "Without changing the set (AND or OR), bring accuracy down to 0%.", h: "Flip the sign of w₁, w₂ and b at the same time. The line is the same; only the side the network calls 1 flips." },
             p4: { t: "On XOR, take at least 40 training steps and observe that the best result never exceeds 75%.", h: "No line solves XOR. The convergence theorem only holds when one exists." } }
  },
  nn02: { name: "What a network can represent", about: "Hidden layer, activations and function approximation.", client: "Calibration lab at the Metalworks",
    title: "A line cannot bend",
    story: "After the perceptron, the team discovered that the shine sensor responds oddly: the reading rises up to a point, drops and rises again. The relation between raw value and true shine is a curve with bumps. A single linear neuron draws a line, and a line cannot bend. The engineers' idea was to combine several simple neurons and add their outputs, each one taking care of a piece of the curve. Surprise: with enough units, the sum can imitate almost any shape.",
    theory: [
      ["Hidden layer: every unit is a piece of a function", "A one-hidden-layer network computes ŷ = Σⱼ w₂ⱼ · g(w₁ⱼ x + b₁ⱼ) + b₂. Each hidden unit j applies an activation g to a line. With ReLU, each unit is a hinge: zero up to a point, then a ramp. The output is a sum of ramps, a broken line that can imitate any continuous curve if there are enough bends."],
      ["Universal approximation theorem", "Cybenko (1989) and Hornik (1991) proved that one hidden layer with a non-linear activation and enough units approximates any continuous function on a closed interval to any desired accuracy. The theorem guarantees the network exists; it does not say how many units are needed nor how to find the weights. Analogy: Lego bricks can build any shape, but nobody promises how many or in what order."],
      ["The activation defines what each piece can do", "Without an activation (g = identity), adding lines gives another line: the hidden layer adds nothing. ReLU gives bends; tanh gives smooth steps. A single ReLU unit cannot represent a bump, because it has only one bend; at least two or three are needed. Counting bends is a good way to estimate how many units a problem asks for."]
    ],
    tasks: { r1: { t: "Approximate |x| with ReLU and at least 2 hidden units until MSE < 0.010.", h: "|x| has one bend at zero: two ramps in opposite directions are enough." },
             r2: { t: "Select the bump with ReLU and H = 1, train at least 300 steps and observe that the error does not fall below 0.010.", h: "One ReLU unit has a single bend. The bump must go up and come down." },
             r3: { t: "Approximate sin(3x) with MSE < 0.020 (any activation, any H).", h: "Count the bends of the sine wave in the interval: several. Increase H and train more than once." },
             r4: { t: "Approximate the bump with ReLU until MSE < 0.006.", h: "Three or four well-placed bends make a bump. If it gets stuck, re-init the weights and train again." } }
  },
  nn03: { name: "Learning the network I", about: "Loss function, gradient and descent.", client: "Weight sensor calibration",
    title: "Walking downhill in the fog",
    story: "The factory's weight sensor has a calibration factor w: true weight is w times the reading. Nobody knows the right w, but there are six parts of known weight. For each guess of w one can measure the mean squared error between what the sensor says and what the reference scale shows. Plotting the error for every w reveals a parabola: a valley. The technician is in the fog, unable to see the whole valley, but can feel the slope of the ground under his feet. The strategy is always to take a step towards the downhill side.",
    theory: [
      ["The loss measures the distance to what we want", "For regression, the mean squared loss is L(w) = (1/n) Σᵢ (w·xᵢ − yᵢ)². It is always positive, zero only when we get everything right, and it punishes large errors more than small ones. Choosing the loss is choosing what 'being wrong' means for the problem."],
      ["The gradient is the slope of the ground", "The derivative ∂L/∂w says how much the loss changes if w grows a little. Positive: going up, so w should decrease. Negative: going down, so w should increase. The gradient-descent rule is w ← w − η · ∂L/∂w. The sign of the gradient gives the direction; its magnitude and η give the step size."],
      ["The learning rate is the length of the stride", "Small η: arrives, but slowly. Too large: jumps to the other side of the valley and may oscillate until it diverges. For a parabola there is an exact stride that reaches the bottom in a single step, and it depends on the curvature (second derivative). Real networks have millions of w and no perfect parabola; that is why η becomes one of the most important hyperparameters."]
    ],
    tasks: { g1: { t: "Bring the loss close to the minimum (within 0.02 of the smallest possible value), any way you like.", h: "Drag w and watch the ball roll down the valley." },
             g2: { t: "Reset (w = −2) and get close to the minimum using only the step button, in at most 15 steps.", h: "η around 0.3 goes down fast without overshooting." },
             g3: { t: "Pick an η that makes the loss INCREASE for three consecutive steps.", h: "Above η = 1, each step jumps further away to the other side of the valley." },
             g4: { t: "Reset and find the η that reaches the bottom of the valley in exactly one step.", h: "For L(w) = a·w² + …, the exact stride is 1/(2a). Here the mean of x² was calibrated to 1." } }
  },
  nn04: { name: "Learning the network II: backpropagation", about: "Computational graph and the chain rule.", client: "Two-layer quality-control network",
    title: "Who is to blame for the error?",
    story: "The inspection network now has two layers: the input goes through a ReLU neuron and then a linear output. It predicted 1.75 for a part whose true value was 1. The error sits at the very end, but the weights that need to change are spread along the path. How to share the blame? The answer is to walk backwards, multiplying local responsibilities: the chain rule applied to a graph. Its name is backpropagation, and it is what makes deep learning computable.",
    theory: [
      ["A computational graph breaks the calculation down", "z = w₁x + b₁ → h = ReLU(z) → ŷ = w₂h + b₂ → L = (ŷ − y)². Each node does one simple operation and knows its own local derivative: ∂L/∂ŷ = 2(ŷ − y); ∂ŷ/∂h = w₂; ∂h/∂z = 1 if z > 0, else 0; ∂z/∂w₁ = x."],
      ["Chain rule: multiply along the path", "∂L/∂w₁ = ∂L/∂ŷ · ∂ŷ/∂h · ∂h/∂z · ∂z/∂w₁. Each factor is a local responsibility; the product is the total responsibility. Backpropagating means computing these products from back to front, reusing results: the value ∂L/∂h serves both w₁ and b₁."],
      ["Dead neuron: a zero gradient breaks the chain", "If z < 0, ReLU returns 0 and its derivative is also 0. Everything before that node receives a null gradient and stops learning, even though the output is wrong. That is why variants exist (Leaky ReLU, GELU) and why initialization matters."]
    ],
    tasks: { b1: { t: "In scenario A, compute ∂L/∂ŷ.", h: "L = (ŷ − y)², so ∂L/∂ŷ = 2(ŷ − y)." },
             b2: { t: "In scenario A, compute ∂L/∂w₂.", h: "ŷ = w₂h + b₂: the derivative with respect to w₂ is h. Multiply by ∂L/∂ŷ." },
             b3: { t: "In scenario A, compute ∂L/∂h and ∂L/∂w₁.", h: "∂L/∂h = ∂L/∂ŷ · w₂. Then pass through the ReLU (z > 0, factor 1) and through z = w₁x + b₁ (factor x)." },
             b4: { t: "In scenario B, compute ∂L/∂w₂ and ∂L/∂w₁.", h: "Notice that z < 0: the ReLU is off. What happens to everything before it?" } }
  },
  nn05: { name: "Training is optimizing", about: "SGD, momentum, Adam and the geometry of the loss.", client: "The Metalworks deep learning team",
    title: "Three runners in the same valley",
    story: "The network grew and training got slow. One intern suggests raising the learning rate; the model blows up. Another suggests lowering it; training takes all night. The team lead draws the problem on the board: the loss surface is not a round bowl, it is a narrow, crooked valley. Plain descent zigzags from wall to wall. There are two classic ideas to escape that: remember the direction that was working (momentum) and use a different step for each parameter (Adam).",
    theory: [
      ["SGD: the gradient of a batch, not of the whole set", "Computing the gradient over all data is expensive; using a mini-batch gives a noisy but cheap estimate. The noise even helps escape bad minima. The rule is still θ ← θ − η∇L. The problem is geometric: in elongated valleys the gradient points at the wall, not at the bottom."],
      ["Momentum: a ball that gains speed", "v ← βv − η∇L; θ ← θ + v. The parameter accumulates velocity in consistent directions and cancels the zigzag in directions that flip sign. With β = 0.9 the ball remembers the last ~10 steps. Nesterov looks one step ahead before correcting."],
      ["Adam: a step adapted to each parameter", "Adam keeps an average of the gradient (m) and of the squared gradient (v) and uses θ ← θ − η · m̂/(√v̂ + ε). Parameters with large gradients get smaller steps; with small gradients, larger ones. That makes it robust to the choice of η, but it is not magic: on some problems SGD with momentum generalizes better."]
    ],
    tasks: { o1: { t: "On the elongated bowl, choose an η that takes SGD below 0.010 in at least 50 steps.", h: "The y direction has 10× the curvature. SGD is only stable with η < 0.1." },
             o2: { t: "On the bowl, find an η where SGD diverges (loss above 1000) while Adam still gets below 0.5.", h: "Adam normalizes the step per parameter; SGD does not. Try η ≥ 0.12 and 50 steps or more." },
             o3: { t: "On the curved valley, show that momentum reaches a lower loss than SGD after 200 steps, staying below 1.", h: "Use a small η (0.01) and β = 0.9. SGD gets stuck zigzagging; the ball with momentum gains speed along the valley." },
             o4: { t: "On the curved valley, take Adam below 0.010 in at most 600 steps.", h: "Adam tolerates a larger η than SGD on this terrain: try 0.05 to 0.1." } }
  },

  rl01: { name: "Introduction to reinforcement learning", about: "Reward, return, discount and policy.", client: "Rover in a Martian canyon",
    title: "Ten points far away or one point right here",
    story: "A rover sits in a corridor of seven positions. At the left end there is a common rock sample worth 1 science point. At the right end, a rare sample worth 10. Every move consumes battery and time, and the mission may be cancelled at any moment. The rover does not choose once: it needs a rule that says, at each position, which way to go. That rule is the policy. How much it values the future relative to the present is the discount. And the value of being at a position is the total reward it expects to accumulate from there.",
    theory: [
      ["The agent-environment loop", "At each instant the agent observes state s, chooses action a, the environment returns a reward r and the next state s'. The goal is not the immediate reward but the return: G = r₁ + γ r₂ + γ² r₃ + …. The discount factor γ ∈ [0,1) makes the sum finite and expresses how much the future is worth today: with γ = 0.9, a reward 10 steps away is worth 0.9¹⁰ ≈ 35% of one now."],
      ["Policy and value function", "A policy π says which action to take in each state. The value function V^π(s) is the expected return starting at s and following π. For the rover with policy 'always right', V(s₂) = γ⁴ · 10, because it takes five moves to reach the rare sample. Comparing V^π of different policies is how we know which is better."],
      ["Bellman equation: today's value depends on tomorrow's", "V^π(s) = Σ_a π(a|s) Σ_s' P(s'|s,a)[R + γ V^π(s')]. It is a recursive relation: the value of a state is the immediate reward plus the discounted value of where you land. It lets us compute V^π iteratively, without simulating walks, and it is the basis of everything that follows."]
    ],
    tasks: { m1: { t: "With γ = 0.90 and no slipping, make the policy take the rover to the rare sample from s2 with V(s2) > 5.", h: "All arrows to the right. Five steps: 0.9⁴ × 10 ≈ 6.6." },
             m2: { t: "Set γ = 0.50 and find the optimal policy: it goes left at s2 and right at s3.", h: "With small γ the future is worth little: at s2, 1 point next door beats 10 points five steps away (10 × 0.5⁴ = 0.6). At s3, 10 × 0.5³ = 1.25 beats 0.5." },

  rl02: { name: "Decisions with a model of the world", about: "MDPs, value iteration and optimal policies.", client: "Rover on terrain with a pit",

(function () {
const L = {
  nn06: { client: "Metalworks calibration lab", title: "The curve that memorized the points",
    story: "The intern had 12 sensor readings and wanted the perfect curve. He raised the polynomial degree until the curve passed exactly through every point: zero training error. The next day, with new parts, the predictions were absurd. The curve had memorized the noise in those 12 readings instead of learning how the sensor behaves. His manager set aside a validation set, which the model never sees while fitting, and showed the dilemma: too simple a model misses everything; too complex a model misses what it has not seen.",
    theory: [
      ["Bias and variance", "A simple model (degree 1) errs systematically: that is bias, or underfitting. A very flexible model follows the sample's noise and changes a lot if the data change: that is variance, or overfitting. Validation error, measured on data outside the fit, draws a U against complexity; the bottom of the U is the sweet spot."],
      ["Validation, early stopping and test", "Training fits the weights; validation picks hyperparameters (degree, λ, when to stop); the test set measures the final result exactly once. Using the test set to choose contaminates it. Stopping when validation gets worse (early stopping) is an implicit form of regularization."],
      ["L2 regularization", "Adding λ‖w‖² to the loss penalizes large weights and smooths the curve even at high degree. λ = 0 is the free fit; too large a λ flattens everything and brings back underfitting. Analogy: a rubber band tying the weights to the origin; the larger λ, the stiffer the band."]
    ],

  nn07: { client: "Visual inspection of steel sheets", title: "A magnifier that slides over the image",
    story: "The inspection camera photographs every sheet and the team wants to detect cracks. A plain MLP would treat each pixel as an independent input, with millions of weights, and would need to relearn the same crack at every position. The idea of convolution is a small 3×3 magnifier that slides over the whole photo with the same weights. If the magnifier responds to vertical edges, it responds to them anywhere. Change the magnifier and you change what the network sees.",
    theory: [
      ["Filters and feature maps", "A filter (kernel) is a small weight matrix. At each position, multiply the filter by the pixels under it and add up: the result becomes one pixel of the feature map. Weights shared across positions give translation equivariance and drastically cut the parameter count."],
      ["Stride, padding and output size", "Stride is the step size of the magnifier; padding adds borders of zeros. The output size is ⌊(N + 2p − k)/s⌋ + 1. A larger stride lowers resolution; padding preserves the image borders."],
      ["Pooling and invariance", "2×2 max-pooling keeps the largest value of each block and halves the map. This tolerates small shifts: the crack may move one pixel and the response stays. Stacking convolution and pooling builds detectors of ever larger patterns."]
    ],
    tasks: { conv1: { t: "Make the output identical to the input (no pooling).", h: "The identity filter has a 1 in the center; with stride 1, padding 1 keeps 14×14." },
      conv2: { t: "Build a filter that responds to vertical edges at least 3× more than to horizontal edges.", h: "Negative left column, positive right column (Sobel x). Use the preset or click the filter cells." },
      conv3: { t: "Make the output map 6×6.", h: "(14 + 2p − 3)/s + 1: stride 2 and padding 0 give 6; or stride 1 without padding plus 2×2 pooling." },
      conv4: { t: "Create a blur filter (weights ≥ 0 only) with stride 1, padding 1 and no pooling that cuts the image's total variation below 60%.", h: "Positive weights average the neighbors; the Blur preset works." } } },
  nn08: { client: "Factory demand forecasting", title: "The signal that gets lost on the way",
    story: "To forecast tomorrow's demand, the network reads the series of past days one step at a time, keeping an internal state h. The problem shows up in training: today's error has to travel back to the event weeks ago that caused it. That signal goes through the same multiplication dozens of times, and multiplying many times by a number below 1 goes to almost zero; above 1, to infinity. The LSTM solved this with a memory highway guarded by gates.",
    theory: [
      ["Recurrence", "An RNN applies the same weights at every step: hₜ = tanh(w·hₜ₋₁ + u·xₜ). It is a very deep network in time, with shared weights. The state h is the memory that carries the past into the future."],
      ["Vanishing and exploding gradients", "By the chain rule, ∂h_T/∂h₁ is a product of T−1 factors w·tanh'(·). If the typical factor is below 1, the product vanishes (the network cannot learn long dependencies); above 1, it explodes (training diverges). Gradient clipping fixes explosion, not vanishing."],
      ["Gates: LSTM and GRU", "The LSTM keeps a cell c with an additive update: cₜ = f·cₜ₋₁ + i·xₜ. The learned forget gate f decides how much to keep. With f near 1, memory and gradient cross many steps almost intact. Analogy: a conveyor belt that is only changed when the gate says so."]
    ],
    tasks: { rnn1: { t: "tanh cell, T ≥ 20: make the gradient of h_T with respect to h_1 drop below 1e-3.", h: "Each step multiplies the gradient by w·tanh'(·) < 1. With w = 0.5 it vanishes fast." },
      rnn2: { t: "Linear cell, T ≥ 20: make the gradient explode above 1e3.", h: "Without tanh, the per-step factor is w. 1.5²⁰ ≈ 3300." },
      rnn3: { t: "Gated cell, T ≥ 50: keep c_T ≥ 0.5.", h: "c_T = f^(T−1). For T = 50, f needs ≈ 0.986 or more." },
      rnn4: { t: "tanh cell, T ≥ 30: keep the memory (h_T ≥ 0.5) and note that the gradient is still below 1e-2.", h: "With w > 1, tanh creates an attractor that retains the value, but it saturates: tanh' ≈ 0 kills the gradient. Try w = 2." } } },
  nn09: { client: "Work-order reader", title: "Where the network should look",
    story: "Work orders arrive as free text: 'the cat climbed on the car on the road'. To understand 'climbed', the model has to decide which other words to pay attention to. Instead of reading everything with equal weight, each word produces a query, compares it with the keys of the others and spreads 100% of its attention among them. It is a weighted average, but the weights are learned and change with every sentence.",
    theory: [
      ["Attention as a weighted average", "Given a query q and keys kᵢ, the weights are softmax(q·kᵢ/τ) and the output is the average of the values vᵢ with those weights. Keys similar to the query get more weight. Analogy: searching a filing cabinet where each folder answers with an intensity proportional to how much it resembles what you are looking for."],
      ["Temperature and the √d scale", "Dividing by τ controls how peaked the softmax is: small τ approaches argmax (hard attention); large τ spreads everything out (uniform attention). In the transformer, τ = √d keeps large dot products from saturating the softmax as the dimension grows."],
      ["Self-attention and the transformer", "In self-attention, queries, keys and values all come from the words themselves, through three learned projections. Several heads in parallel look at different relations. The cost grows with the square of the sequence length, the price of scale in LLMs."]

    tasks: { attention1: { t: "Make the query give at least 80% of its weight to 'cat'.", h: "'cat' and 'dog' are neighbors. Point the query to the side where 'cat' beats 'dog' (negative angle) and lower the temperature." },

      attention4: { t: "Make 'hard' attention: 99% or more on 'car'.", h: "Point at 'car' (≈ 145°), high norm and low temperature." } } },
  nn10: { client: "Compressing sensor logs", title: "Store less without losing what matters",
    story: "Each part produces two correlated measurements and storage is full. The idea is to train a network that squeezes both measurements into a single number and then tries to rebuild them: an autoencoder. There are no labels; the input itself is the target. If the measurements live near a line, one number is enough. But some parts have measurements that form a ring, and there no line will do.",
    theory: [
      ["Autoencoder", "Encoder and decoder with a bottleneck in the middle: the network is forced to summarize the input in a few dimensions and rebuild it. The loss is the reconstruction error. It learns without labels, and the resulting code serves as pretraining or as a representation for other tasks."],
      ["Linear = PCA", "A linear autoencoder with a k-dimensional bottleneck learns the same subspace as principal component analysis: the k directions of largest variance. Projecting onto the main direction loses only the variance perpendicular to it."],
      ["Nonlinearity and embeddings", "When data live on a curve (a ring, for example), no line summarizes them, but a nonlinear code (the angle) does. Word embeddings follow the same idea: dense vectors whose geometry encodes meaning."]

      autoenc4: { t: "On the ring, switch to the nonlinear (angle) encoder and bring the error below 10% of the best linear one.", h: "A single number, the angle, describes a point on the ring well. That is what a nonlinear autoencoder can learn." } } },
  nn11: { client: "Faded label reader", title: "A memory that completes itself",
    story: "Box labels arrive smudged, with half the pixels flipped. Instead of classifying, the idea is an associative memory: store the clean letters and, faced with a dirty version, let the network roll downhill to the nearest memory. This is the Hopfield network, tied to the physics of magnets and to the rule Hebb stated in 1949: neurons that fire together wire together.",
    theory: [
      ["Hebb's rule", "To store patterns p (with values ±1), the weights are W = Σ p·pᵀ / N, with no self-connections. Each pattern strengthens the links between pixels that agree. No gradient, no epochs: learning is adding correlations."],
      ["Energy and attractors", "The dynamics set each neuron to the sign of Σ wᵢⱼxⱼ. The energy E = −½ xᵀWx never goes up, so the network descends to a local minimum. Stored patterns are energy valleys (attractors); the inverse −p is too, because the rule is symmetric."],
      ["Capacity and modern Hopfield", "With N neurons, the classic network stores about 0.14·N random patterns; beyond that, spurious states appear and memories blend. Modern Hopfield networks use exponential energies, store far more and have the same mathematical form as transformer attention."]

    tasks: { hopfield1: { t: "Store at least 2 letters, corrupt the target letter with ≥ 20% noise and recover it exactly.", h: "Tick T and L, choose T, noise 20%, Corrupt and then Recover." },

  nn12: { client: "Digitizing part profiles", title: "A network that is the signal itself",
    story: "A part's profile was measured at 48 points and the team wants a continuous representation to query any position. Instead of storing the table, they train a network that takes the coordinate x and returns the height: a neural field. The surprise: the network quickly learns the overall shape, but the fine details do not appear even after thousands of steps. A simple trick changes everything: before entering the network, x becomes sines and cosines.",
    theory: [

      ["Spectral bias", "Networks trained by gradient descent learn low-frequency components first; high frequencies take very long or never arrive. Analogy: sketching the outline first and the details later, but with an eraser that removes details faster than you can draw them."],
      ["Fourier features", "Replacing x by [sin(2πBx), cos(2πBx)], with frequencies B drawn from a normal of scale σ, gives the network direct access to high frequencies. Too small a σ stays smooth; too large a σ memorizes the points and oscillates between them, overfitting in the frequency domain."]

  nn13: { client: "Designing the defect classifier", title: "How much network the problem needs",
    story: "Time to design the real defect classifier. The two classes wind around each other like two spirals, and the embedded chip's budget is tight: every parameter costs memory. The design question is not 'what is the largest possible network' but 'what is the smallest network that solves this well with the data I have'. Depth, width, learning rate and amount of data all enter the same equation.",
    theory: [

      ["Data and generalization", "With little data, a large network memorizes the training set (100%) and generalizes poorly. More data, regularization or a smaller network shrink the gap between training and validation. Data augmentation and transfer learning are the same idea at scale."],
      ["Design practice", "Start small and grow until validation stops improving; watch training and validation together; tune the learning rate before touching the architecture; log every experiment. It is Karpathy's recipe: first make it overfit, then regularize."]

    tasks: { spiral1: { t: "With depth 0 (logistic regression), train ≥ 200 steps: validation stays at or below 70%.", h: "Without a hidden layer the boundary is a line; interleaved spirals are not linearly separable." },

      spiral4: { t: "With at most 30 training points, reach 100% on training and at least 8 points less on validation.", h: "Little data and a big network: it memorizes. Use 3 layers of 24." } } },
  nn14: { client: "Wrap-up: the optimization team", title: "One function, one loss, one optimizer",
    story: "At the end of the course, the team gets a different problem: tuning two parameters of a machine whose performance has dozens of false valleys. Gradient descent, which worked so well for networks, falls into the first valley and stops. A colleague proposes another family of computational intelligence: a population of solutions that reproduces, mixes and mutates, as in evolution. Neural networks, evolutionary computation and fuzzy logic are the field's three traditions.",
    theory: [
      ["The three paradigms", "Neural networks learn representations with gradients; evolutionary computation searches with a population, selection and variation; fuzzy systems reason with graded memberships. Every problem in the course fit three choices: a function (the model), a loss and an optimizer."],
      ["Gradients and local minima", "Gradient descent uses only the local slope. On landscapes with many valleys, such as the Rastrigin function, it stops at the minimum nearest to the starting point. In large networks this hurts less, because in high dimension almost every critical point is a saddle."],
      ["Genetic algorithm", "Selection (the best reproduce), crossover (mixing parents) and mutation (noise) create new generations. Without mutation the population never leaves the region where it was born; with too much, it becomes random search. Elitism keeps the best found."]

    tasks: { evo1: { t: "Run gradient descent from (3.3, 3.1) and watch it stop at a local minimum (f > 1).", h: "The gradient only sees the neighborhood: it falls into the nearest valley." },
      evo2: { t: "With the genetic algorithm, find a point with f < 0.1.", h: "Mutation around 0.5 and 30 to 60 individuals; run +50 a few times." },
      evo3: { t: "Set mutation to zero and run ≥ 50 generations: the best stays above 1.", h: "Crossover only mixes parents: the population never leaves the square where it was born, far from the origin." },
      evo4: { t: "Find f < 0.1 in at most 60 generations.", h: "Set population and mutation before running (New population resets the generations). Start with 60 individuals and σ = 0.5." } } },

  rl03: { client: "Rover learning without a map", title: "Wait for the end or learn along the way",
    story: "The rover no longer knows the terrain's probabilities: it can only move and observe. In a corridor of five segments, A to E, it starts in the middle and moves left or right at random; exiting on the right earns 1 point, on the left nothing. What is each segment worth? One strategy waits for each trip to end and uses the total (Monte Carlo). Another adjusts the value at every step, using the estimated value of the next segment (temporal difference).",
    theory: [
      ["Monte Carlo", "Estimates V(s) by averaging the returns observed after visiting s: V(s) ← V(s) + α(G − V(s)). It is unbiased, but must wait for the episode to end and inherits all the variance of the return."],
      ["TD(0)", "Updates every step with a target that uses its own estimate: V(s) ← V(s) + α(r + γV(s') − V(s)). The term in parentheses is the TD error δ. It is biased (the target depends on a still-wrong V) but has far less variance; it usually learns faster, as in Sutton and Barto's random-walk example."],
      ["Step size and batch", "A large α reacts fast but never settles; a small α settles but is slow. In batch mode (replaying the same episodes until convergence), MC minimizes error on the observed returns while TD converges to certainty equivalence: the value of the maximum-likelihood MDP."]
    ],
    tasks: { mctd1: { t: "Bring the average RMS error of TD(0) below 0.08.", h: "α = 0.05 to 0.1 and about 100 episodes." },
      mctd2: { t: "Bring the average RMS error of Monte Carlo below 0.08.", h: "MC is noisier: use a small α (0.01 to 0.02) and more episodes." },
      mctd3: { t: "With α_TD ≥ 0.5 and ≥ 100 episodes, show TD error staying above 0.1.", h: "A large step makes the value jump every episode and never settle." },
      mctd4: { t: "With the same α (≤ 0.1) for both and ≥ 50 episodes, show TD with lower error than MC.", h: "Match the sliders (0.05), reset and run +10 a few times." } } },
  rl04: { client: "Rover at the cliff edge", title: "The optimal path and the safe path",
    story: "Between the base and the sample there is a cliff. The shortest path hugs the edge; any misstep sends the rover back to the start with −100. During training, the rover sometimes picks a random move (ε), and that is where the two algorithms disagree. Q-learning learns the optimal path assuming it will act perfectly in the future. SARSA learns the value of what it actually does, stumbles included, and prefers to stay away from the edge.",
    theory: [
      ["Model-free control", "To choose actions without knowing P, learn Q(s, a) instead of V(s). Generalized policy iteration alternates evaluation and improvement; ε-greedy ensures exploration: with probability ε, a random action."],
      ["SARSA × Q-learning", "SARSA (on-policy) uses the target r + γQ(s', a'), with a' the action that will actually be taken. Q-learning (off-policy) uses r + γ maxₐ' Q(s', a'), the value of the greedy action. With ε > 0, SARSA accounts for the risk of stumbling; Q-learning ignores it in the target."],
      ["Approximation and DQN", "With too many states for a table, Q becomes a neural network. DQN stabilizes Q-learning with experience replay and a frozen target network. The deadly triad (approximation, bootstrapping and off-policy) explains why this can diverge."]
    ],
    tasks: { cliff1: { t: "Make Q-learning's greedy path optimal (13 steps, along the cliff).", h: "Run about 100 to 300 episodes with ε = 0.1." },
      cliff2: { t: "With ε ≥ 0.05, make SARSA learn a safe path away from the cliff (more than 13 steps).", h: "SARSA evaluates the policy it actually runs, including ε's stumbles. Its path may take 300 to 500 episodes to settle." },
      cliff3: { t: "With ε ≥ 0.05 and ≥ 200 episodes, show SARSA with higher online average reward than Q-learning.", h: "Q-learning learns the optimal path but falls off during training because of ε." },
      cliff4: { t: "Reset with ε ≤ 0.01 and train: SARSA also finds the 13-step path.", h: "Without random exploration, behavior is greedy and SARSA becomes Q-learning. Set ε to zero before training." } } },
  rl05: { client: "Rover sampling strategy", title: "Push the policy toward what worked",
    story: "Instead of estimating values, the team decides to adjust the rover's policy directly: the probabilities of choosing each of three routes. After each trip, the chosen route becomes more likely if the reward was good. It works, but it is noisy: if all rewards are high, every chosen route gets reinforced and only chance separates the best ones. Subtracting a baseline, what one expected to earn, removes much of the noise.",
    theory: [
      ["Why parameterize the policy", "Parameterized policies πθ(a|s) handle continuous actions, can be stochastic and change smoothly with θ. The goal is to maximize J(θ) = E[R] directly, without going through Q."],
      ["The likelihood-ratio trick", "∇J = E[R · ∇log πθ(a)]. Just sample actions and weight the score function ∇log π by the reward: that is REINFORCE. For a softmax, ∇log π(a) = 1ₐ − π."],
      ["Baseline and entropy", "Subtracting b from R does not change the expected gradient (E[∇log π] = 0), but it can cut variance a lot; the natural choice is b ≈ E[R]. An entropy bonus keeps the policy from collapsing onto a single action too early. The next step is actor-critic: a learned critic plays the baseline's role."]
    ],
    tasks: { reinforce1: { t: "Make the policy choose the best action (arm 2) with ≥ 90%.", h: "α = 0.1 and a few hundred updates." },
      reinforce2: { t: "With offset ≥ 10 and the baseline on, reach 90% in at most 400 updates.", h: "Turn on the baseline before training (the checkbox resets the policy)." },
      reinforce3: { t: "With offset ≥ 10 and ≥ 50 updates, show the variance without baseline ≥ 10× the variance with baseline.", h: "Adding a constant to the reward does not change the expected gradient, but it inflates the noise of R·∇log π." },
